<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono">
  <link rel="stylesheet" href="./styles.css">
  
  <title>Frontend Mentor | Tip calculator app</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>
    <div class="svg-logo">
    <img src="./images/logo.svg" alt="logo" height="50px">
  </div>
    <section class="calculator-card">
      <div class="calculation">
        <form>
          <div class="form-item">
          <label for="bill" >Bill</label>
        <div class="input-container">
          <span class="icon">
            <img src="./images/icon-dollar.svg" alt="dollar">
          </span>
          <input type="number" id="bill" name="bill" placeholder="0">
        </div>
        </div>
        </form>

        <section class="tip">
          <p style="font-size: 15px;">Select Tip %</p>
          <div class="tip-buttons">
            <button class="tip-button" type="button" id="5">5%</button>
            <button class="tip-button" type="button" id="10">10%</button>
            <button class="tip-button" type="button" id="15">15%</button>
            <button class="tip-button" type="button" id="25">25%</button>
            <button class="tip-button" type="button" id="50">50%</button>
            <!-- <button class="custom" type="button" id="custom">Custom</button> -->
            <input type="number" class="custom" id="custom" placeholder="Custom">
          </div>
        </section>

        <form>
          <div class="form-item" style="margin-top: 2rem;">
              <label for="people">Number of People
                <span class="error">Can't be zero</span>
              </label>

              <div class="input-container">
                  <span class="icon">
                      <img src="./images/icon-person.svg" alt="person"> 
                  </span>
                  <input type="number" id="persons" name="persons" placeholder="0">
              </div>
          </div>
        </form>
      </div>
        <section class="display-container">
          <div class="totals">
            <div class="bill">
              <div class="person">
                <p> Tip Amount</p>
                <span>/ Person</span>
              </div>
              <div class="amount show-tip"><img src="./images/icon-dollar.svg" alt="dollar">0</div>
            </div>

            <div class="bill">
              <div class="person">
                <p> Total</p>
                <span>/ Person</span>
              </div>
              <div class="amount show-total"><img src="./images/icon-dollar.svg" alt="dollar">0</div>
            </div>
          </div>
            <button class="reset" type="reset" id="reset">RESET</button>
          </section>
    </section>

  </main>

  <!-- Bill

  Select Tip %
  5%
  10%
  15%
  25%
  50%
  Custom

  Number of People

  Tip Amount
  / person

  Total
  / person

  Reset -->

    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </div> -->

  <script src="calclator.js"></script>
</body>
</html>
